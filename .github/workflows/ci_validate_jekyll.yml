---
name: ci_validate_jekyll

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'littlemonarch' }}
    env:
      BUNDLE_PATH: vendor/bundle
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      # Gemfile.lock pins BUNDLED WITH 2.0.2, which is incompatible with
      # Ruby 3.x (uses String#untaint, removed in Ruby 3.0). bundle install
      # re-reads that pin at runtime regardless of what's pre-installed, and
      # even `bundle lock` itself would trip the same error before it could
      # rewrite it - so patch the line directly, in this checkout only,
      # rather than touching the committed lockfile. Pin to the bundler that
      # ships with the installed Ruby (the toolcache is not writable on the
      # self-hosted runner, so a different bundler cannot be installed).
      - name: Repin bundler in this checkout only
        run: sed -i "/^BUNDLED WITH/,+1 s/2\.0\.2/$(bundle -v | awk '{print $NF}')/" Gemfile.lock

      - name: Install gems
        run: bundle install --jobs 4

      - name: Build site
        run: bundle exec jekyll build
