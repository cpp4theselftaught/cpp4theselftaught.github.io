---
name: ci_dependabot_automerge

# This file is maintained in vln-devsecops/guidance, which keeps two identical
# copies of it - one under .github/workflows/ and one under
# scaffold/repository-compliance/.github/workflows/ - and fails CI if they
# drift. Change it there, not in
# place, and read runbooks/dependabot-automerge.md first: every piece of this
# workflow is load-bearing and most of it is not obvious.
#
# Event-driven, not polling. Each time one of the repo's PR CI workflows
# finishes, this workflow looks once at the PR head commit and either merges
# it (everything else has already succeeded), defers (something is still
# running - that workflow's own completion will trigger the next look), or
# refuses (something failed). Nothing sits on a runner waiting for a queue.
#
# `workflows: ["*"]` listens to every workflow in the repo, so there is no
# per-repo list to maintain. Verified in a scratch repo (2026-11-17): it fires
# once per completed workflow and does not re-trigger on this workflow's own
# completion. GitHub does not document wildcard support, so if it ever stops
# working the symptom is this gate going silent (PRs left for a human), not a
# wrong merge; the regression suite pins the "*" so a change is deliberate.
# Completions that are not Dependabot PR runs are rejected by the job-level
# `if` below without taking a runner.
on:
  workflow_run:
    workflows: ["*"]
    types: [completed]

# Read-only. Every write this workflow performs - approving and merging - uses
# a GitHub App installation token, not GITHUB_TOKEN, so GITHUB_TOKEN needs no
# write scope. That matters more than usual here: the job runs with repository
# secrets, so a compromised step or action would otherwise hold a repo-write
# token.
permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

# One evaluation per commit at a time. Two CI workflows finishing together
# would otherwise both reach the merge step. Never cancel: a queued evaluation
# is the one that sees the final state.
concurrency:
  group: ci_dependabot_automerge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  automerge:
    # littlemonarch-gate is only registered in these orgs; elsewhere fall back
    # to GitHub-hosted. It is a dedicated runner, separate from the CI runner,
    # so the gate never queues behind the checks it is evaluating.
    # Safe on a self-hosted runner because the job-level `if` below limits it
    # to Dependabot branches of this repository and it never checks out PR
    # code.
    runs-on: ${{ contains(fromJSON('["VlinderSoftware","vln-devsecops","vln-polaris","cpp4theselftaught","vln-bookstore","vln-sneakyimmediatetapeworm","vln-coppice","rtimdb","rxmail-io"]'), github.repository_owner) && 'littlemonarch-gate' || 'ubuntu-latest' }}
    # Cheap pre-filter so unrelated completions (pushes to main, human PRs)
    # never start a job. It is not the security boundary: the `resolve` step
    # re-checks the PR's author through the API, because a branch name is
    # whatever its pusher chose.
    if: >
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["pull_request","pull_request_target"]'), github.event.workflow_run.event) &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    steps:
      # Auto-merge is opt-in per repository, and *installing the App on the
      # repository* is what opts in. The App id and private key live at org
      # level, so they are readable everywhere; installation is the per-repo
      # switch, and it is centrally visible on one App settings page rather
      # than scattered across N repo secrets.
      #
      # Where the App is not installed this call 404s. continue-on-error keeps
      # that from failing the run: a repo that never opted in has done nothing
      # wrong, and the token output is simply empty, so every step below skips
      # and the PR is left for a human.
      #
      # There is deliberately no fallback to GITHUB_TOKEN. GITHUB_TOKEN can
      # only approve when the org/repo setting "Allow GitHub Actions to create
      # and approve pull requests" is enabled, so falling back would make
      # whether a repo auto-merges depend on an org-level setting nobody sets
      # per repo - and would silently start auto-merging in repos where that
      # was never the intent. Dormant is the safe failure here: a human
      # merging is a fine outcome, an unintended auto-merge is not.
      #
      # permission-* narrows the installation token to what this workflow
      # actually does. The App may be granted more; this token will not carry
      # it.
      - name: Mint a GitHub App installation token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.DEPENDABOT_AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.DEPENDABOT_AUTOMERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Report that auto-merge is not enabled
        if: steps.app-token.outputs.token == ''
        env:
          # Folded scalar rather than shell line continuations: a backslash
          # continuation inside the quoted string embeds the indentation of
          # each continued line into the notice text.
          MSG: >-
            No App installation token could be minted for this repository, so
            Dependabot auto-merge is disabled and this PR will not be merged
            automatically. Usually that means the auto-merge App is not
            installed here, which is the opt-in switch. See
            runbooks/dependabot-automerge.md in vln-devsecops/guidance.
        run: echo "::notice::$MSG"

      # Which PR is this completion about? Resolved from the commit through
      # the API rather than from the event payload: the payload's
      # `pull_requests` array is empty for some PRs, and this job holds a
      # privileged token. Only an open, same-repository PR authored by
      # Dependabot whose head is still this commit qualifies. A closed PR, a
      # human's PR, a fork, or a PR that has moved on to a newer commit (whose
      # own completions will trigger their own evaluation) all end here.
      - name: Find the Dependabot PR for this commit
        id: resolve
        if: steps.app-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" --paginate --slurp \
            | jq -c --arg sha "$SHA" --arg repo "$REPO" '
                [ .[][]
                  | select(.state == "open"
                      and .head.sha == $sha
                      and .head.repo.full_name == $repo
                      and .user.login == "dependabot[bot]") ]
                | first // empty')

          if [ -z "$pr" ]; then
            echo "::notice::No open Dependabot PR has $SHA as its head; nothing to do."
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "number=$(jq -r .number <<<"$pr")" >> "$GITHUB_OUTPUT"
          echo "url=$(jq -r .html_url <<<"$pr")" >> "$GITHUB_OUTPUT"

      # dependabot/fetch-metadata cannot be used here: it reads the
      # `pull_request` event payload, which a workflow_run does not carry. This
      # does the same thing it does - read the update-type lines from the
      # metadata block Dependabot writes into its commit message - and refuses
      # unless GitHub itself attributes the commit to Dependabot and has
      # verified its signature. A commit message is only trustworthy as
      # metadata when both hold; the authorship check in the merge step covers
      # the rest of the branch.
      - name: Classify the update
        id: classify
        if: >
          steps.app-token.outputs.token != '' &&
          steps.resolve.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          commit=$(gh api "repos/$REPO/commits/$SHA")
          login=$(jq -r '.author.login // ""' <<<"$commit")
          verified=$(jq -r '.commit.verification.verified // false' <<<"$commit")

          if [ "$login" != "dependabot[bot]" ] || [ "$verified" != "true" ]; then
            echo "::notice::Head commit is not a verified Dependabot commit" \
                 "(author '$login', verified=$verified); leaving the PR for a human."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          types=$(jq -r '.commit.message' <<<"$commit" | tr -d '\r' \
            | sed -n 's/^[[:space:]]*update-type:[[:space:]]*//p')

          # Every dependency in a group must be minor or patch; one major
          # anywhere keeps the whole PR for a human. No metadata at all is
          # not eligible either.
          if [ -n "$types" ] \
             && ! grep -qvxE 'version-update:semver-(minor|patch)' <<<"$types"; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not a minor/patch-only update; leaving the PR for a human."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          fi

      # `gh pr merge --auto` only actually waits for anything if the default
      # branch has a required status check configured via branch protection or
      # a ruleset. Most repos in this portfolio have none - private repos on
      # the Free plan get a 403 configuring one at all - and with nothing
      # required, `--auto` merges the moment it is invoked, regardless of
      # sibling jobs still running or already failed. That is what let
      # node-dashboard#37 merge past a failing `plan` job. This step gates on
      # the commit's own workflow runs and check runs instead, so it fails
      # closed on every plan tier and does not depend on branch-protection
      # config staying correct.
      #
      # Workflow runs are read as well as check runs because a workflow run
      # exists the moment its event fires, whereas its check runs only appear
      # once a runner picks the jobs up. A queued self-hosted job therefore
      # shows up here as an unfinished run even before it has posted a single
      # check - closing the window in which "nothing has failed yet" would
      # otherwise look like success.
      #
      # `result` is merge (everything succeeded), wait (something is still
      # running; its completion triggers the next evaluation) or blocked
      # (something failed, or there was nothing to gate on).
      - name: Evaluate the other checks on this commit
        id: gate
        if: >
          steps.app-token.outputs.token != '' &&
          steps.resolve.outputs.number != '' &&
          steps.classify.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          # --paginate emits one JSON document per page; --slurp collects them
          # into a single array, so a commit with enough runs to paginate does
          # not yield concatenated (invalid) JSON. This run is excluded by id
          # for completeness; it reports against the default branch's commit,
          # not the PR's, so it should never appear.
          runs=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
              --paginate --slurp \
            | jq --arg run "$RUN_ID" \
                '[.[] | .workflow_runs[] | select((.id | tostring) != $run)]')
          checks=$(gh api "repos/$REPO/commits/$SHA/check-runs" --paginate --slurp \
            | jq '[.[] | .check_runs[]]')

          total=$(jq -n --argjson r "$runs" --argjson c "$checks" '($r + $c) | length')
          if [ "$total" -eq 0 ]; then
            # Fail closed. A commit with nothing on it has nothing for this
            # gate to gate on, and merging anyway would be the original
            # unguarded behaviour wearing a gate's name.
            echo "No workflow runs or check runs found on $SHA. Refusing to" \
                 "auto-merge: there is nothing gating this PR."
            echo "result=blocked" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # Anything that is not success/skipped/neutral blocks the merge,
          # including cancelled, timed_out, action_required and stale. A
          # failure blocks immediately, even while other checks still run.
          failed=$(jq -n --argjson r "$runs" --argjson c "$checks" '
            [ ($r + $c)[]
              | select(.status == "completed"
                  and (.conclusion | IN("success", "skipped", "neutral") | not)) ]')
          if [ "$(jq 'length' <<<"$failed")" -gt 0 ]; then
            echo "Refusing to auto-merge; did not succeed:"
            jq -r '.[] | "- \(.name): \(.conclusion)"' <<<"$failed"
            echo "result=blocked" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          pending=$(jq -n --argjson r "$runs" --argjson c "$checks" \
            '[ ($r + $c)[] | select(.status != "completed") ]')
          if [ "$(jq 'length' <<<"$pending")" -gt 0 ]; then
            echo "Not merging yet; still running (its completion will trigger" \
                 "the next evaluation):"
            jq -r '.[] | "- \(.name): \(.status)"' <<<"$pending"
            echo "result=wait" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "All $total other run(s) and check(s) on $SHA succeeded."
          echo "result=merge" >> "$GITHUB_OUTPUT"

      # Approves with the App installation token only - see the minting step
      # above for why there is no GITHUB_TOKEN fallback.
      #
      # The approving identity is the App, not a person. With a PAT every
      # auto-merged PR carried its owner's name on the approval, which is a
      # misleading audit trail for a control whose whole purpose is recording
      # who vouched for a change.
      #
      # SECURITY: this job must never check out or execute PR head code.
      # workflow_run runs with repository secrets against the default branch;
      # adding actions/checkout of the PR head here would expose those secrets
      # to code from the PR branch. It deliberately only calls `gh` and `jq`,
      # and passes every piece of event data through `env`, never by
      # interpolating it into a script.
      - name: Approve and merge minor/patch updates
        id: merge
        if: >
          steps.app-token.outputs.token != '' &&
          steps.gate.outputs.result == 'merge'
        run: |
          set -euo pipefail

          # The gate validated $SHA, the head at the time this run started.
          # If Dependabot has pushed since (a rebase, a follow-up bump), the
          # PR now points at a commit this run never checked - and merging
          # applies to the PR, not to a SHA. Without a required status check
          # there is nothing downstream to catch it.
          #
          # Bail out and let the evaluation triggered by the newer commit do
          # the gating. Exit 0, not 1: being superseded is normal.
          current=$(gh pr view "$PR_URL" --json headRefOid --jq .headRefOid)
          if [ "$current" != "$SHA" ]; then
            echo "PR head moved $SHA -> $current since this run started;" \
                 "leaving it to the run for $current."
            exit 0
          fi

          # Auto-merge covers what Dependabot wrote, and nothing else. If
          # anyone has pushed onto the branch, the PR now carries changes no
          # one reviewed and that the "it's only a version bump" reasoning
          # does not apply to, so hand it back to a human.
          #
          # Commits with no resolvable author count as foreign: an unmatched
          # commit email is exactly what an unexpected push looks like, and
          # guessing in favour of merging is the wrong way to be wrong.
          foreign=$(gh pr view "$PR_URL" --json commits --jq '
            [ .commits[]
              | (.authors // [])
              | if length == 0 then ["unknown"] else map(.login // "unknown") end
              | .[]
            ] | unique | map(select(. != "dependabot[bot]")) | join(", ")')
          if [ -n "$foreign" ]; then
            echo "::notice::PR carries commits authored by: $foreign." \
                 "Auto-merge only covers Dependabot's own commits, so this" \
                 "PR is left for human review."
            exit 0
          fi

          # Not `gh pr merge --auto`: that calls the GraphQL
          # enablePullRequestAutoMerge mutation, which since GitHub's
          # undocumented 2026-03-25 behaviour change refuses to activate
          # unless every check on the commit is already passing. It is also
          # unnecessary - `--auto` exists to wait for checks that are not yet
          # green, and the evaluation above already established that they are
          # all green. So merge directly.
          gh pr review --approve "$PR_URL"
          gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ steps.resolve.outputs.url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
